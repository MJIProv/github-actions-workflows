[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masked-stack"
version = "1.1.0"
description = "Verified masked-array stack: numpy.ma defines absence, csgraph and contourpy consume it."
requires-python = ">=3.11"

# Pinned as a SET. contourpy's source tracks numpy's annotation state; bumping one
# alone relocates the skew rather than removing it.
dependencies = [
    "numpy==2.3.4",
    "scipy==1.16.1",
    "contourpy==1.3.3",
]

[project.optional-dependencies]
# matplotlib declares only floors (contourpy>=1.0.1, numpy>=1.25), no ceiling.
plot = ["matplotlib>=3.9"]

# This distribution carries NO importable package - it delivers the pinned dependency
# set and its tooling. Without this, setuptools auto-discovery sees canonical/ and
# superseded/ as competing top-level packages and refuses to build ("Multiple
# top-level packages discovered in a flat-layout"). verify.sh step 6 guards it.
[tool.setuptools]
py-modules = []

[tool.mypy]
python_version = "3.11"
# contourpy removes `# type: ignore[no-untyped-call]` as numpy types the np.ma
# functions it calls (1.3.3 and again in 1.4.0). With a numpy older than the pin,
# those calls read as untyped again and mypy flags the now-absent ignores.
warn_unused_ignores = false
